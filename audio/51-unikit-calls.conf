# unikit: mark browser and Electron mics as calls, so Bluetooth earbuds switch to Handsfree
# while they're open (WirePlumber switches back when the mic closes).
pulse.rules = [
    {
        matches = [
            # Chromium-based: Helium, Chrome, Brave, Edge, Vivaldi... ("<name> input")
            { application.name = "~.* input$" }
            # Gecko-based: Firefox, Zen, LibreWolf, Floorp, Waterfox
            { application.process.binary = "~^(firefox|firefox-bin|zen|zen-bin|librewolf|floorp|waterfox)$" }
            # Electron call apps, whose mic stream carries the app's plain name ("Slack")
            { application.process.binary = "~^(slack|Discord|discord|teams-for-linux)$" }
        ]
        actions = { update-props = { media.role = "Communication" } }
    }
]
